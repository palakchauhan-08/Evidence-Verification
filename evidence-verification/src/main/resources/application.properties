spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/evidence_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:palak08}

jwt.secret=${JWT_SECRET:mySecretKeyForEvidenceVerificationSystem123456789}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Blockchain Configuration (Polygon Amoy Testnet)
blockchain.mode=${BLOCKCHAIN_MODE:mock}
blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:https://rpc-amoy.polygon.technology}
blockchain.private-key=${BLOCKCHAIN_PRIVATE_KEY:}
blockchain.contract-address=${BLOCKCHAIN_CONTRACT_ADDRESS:}
blockchain.chain-id=${BLOCKCHAIN_CHAIN_ID:80002}

# SMTP Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application Frontend Base URL
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# Maximum Upload Size Configuration (50MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB