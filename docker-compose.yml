services:
  postgres:
    image: postgres:15-alpine
    container_name: evidence_postgres
    restart: always
    environment:
      POSTGRES_DB: evidence_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-palak08}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evidence_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./evidence-verification
      dockerfile: Dockerfile
    container_name: evidence_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/evidence_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-palak08}
      JWT_SECRET: ${JWT_SECRET:-mySecretKeyForEvidenceVerificationSystem123456789}
      BLOCKCHAIN_MODE: mock
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    container_name: evidence_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
      - "5173:80"

volumes:
  postgres_data:
